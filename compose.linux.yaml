# Linux: reach the host's loopback-only Blender bridge without exposing it on the LAN.
#   docker compose -f compose.yaml -f compose.linux.yaml up -d --build --wait
services:
  blender-forge:
    network_mode: host
    ports: !reset []
    command: ["--http", "--listen", "127.0.0.1:${BLENDER_FORGE_PORT:-8080}"]
    environment:
      BLENDER_FORGE_BRIDGE_HOST: 127.0.0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BLENDER_FORGE_PORT:-8080}/healthz', timeout=3)"]
