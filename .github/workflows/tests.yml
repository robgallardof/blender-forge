name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Protocol, spec and MCP stdio tests on every OS (no Blender needed).
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp/blender-forge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q -m "not blender and not network"

  # Real Blender: headless bridge, every operation, renders, exports and the extension install.
  blender:
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "5.2.3"
      BLENDER_SHA256: "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec"
    defaults:
      run:
        working-directory: mcp/blender-forge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install Blender ${{ env.BLENDER_VERSION }} LTS (checksum verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libgl1-mesa-dri
          cd "$RUNNER_TEMP"
          name="blender-${BLENDER_VERSION}-linux-x64"
          curl -sSfL -o blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/${name}.tar.xz"
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          tar -xJf blender.tar.xz
          echo "BLENDER_FORGE_BLENDER=$RUNNER_TEMP/${name}/blender" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run pytest -q -m "not network"
