[project]
name = "blender-forge"
version = "0.1.0"
description = "MCP server for Blender: model, light, render, animate and export from any agent, with visual review."
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = ["mcp[cli]>=1.30,<2", "pillow>=10.1"]

[project.scripts]
blender-forge = "blender_forge.server:main"
blender-forge-install = "blender_forge.install:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = ["blender: needs a Blender executable (found automatically or via BLENDER_FORGE_BLENDER)",
           "network: talks to api.polyhaven.com"]
